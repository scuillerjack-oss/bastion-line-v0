<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Icône V3 (cahier, section 5) : silhouette de forteresse reprenant
       EXACTEMENT le langage visuel déjà établi en jeu (voir src/ui/render.js,
       drawBase -- mêmes teintes pierre/bannière), pour une identité médiévale
       cohérente plutôt qu'un dessin abstrait sans rapport avec le jeu.
       Formes larges et peu nombreuses : lisible à taille d'icône Android
       réelle (~48px), pas seulement en grand. -->
  <rect width="128" height="128" rx="24" fill="#0d1a12"/>
  <!-- Corps de pierre -->
  <path d="M32 108 L32 58 L40 46 L88 46 L96 58 L96 108 Z" fill="#8a8272" stroke="#2a2420" stroke-width="4"/>
  <!-- Créneaux -->
  <rect x="34" y="38" width="12" height="12" fill="#8a8272" stroke="#2a2420" stroke-width="3"/>
  <rect x="58" y="38" width="12" height="12" fill="#8a8272" stroke="#2a2420" stroke-width="3"/>
  <rect x="82" y="38" width="12" height="12" fill="#8a8272" stroke="#2a2420" stroke-width="3"/>
  <!-- Porte voûtée -->
  <path d="M56 108 L56 78 Q64 66 72 78 L72 108 Z" fill="#241f19"/>
  <!-- Hampe + bannière (accent chaleureux, identité déjà établie en jeu) -->
  <rect x="61" y="16" width="6" height="24" fill="#5c5346"/>
  <path d="M67 16 L90 24 L67 32 Z" fill="#e76f51"/>
</svg>
